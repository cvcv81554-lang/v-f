plugins {
    id 'com.android.application'
}

// رابط تطبيقك على Cloudflare. يُمرَّر من GitHub Actions أو: gradle assembleDebug -PAPP_URL=https://xxx.pages.dev/
def appUrl = (project.findProperty('APP_URL') ?: 'https://CHANGE-ME.pages.dev/').toString().trim()

android {
    namespace 'app.vkte.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vkte.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', '"' + appUrl.replace('\\', '').replace('"', '') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
