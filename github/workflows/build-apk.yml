name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط تطبيقك على Cloudflare (مثال: https://my-app.pages.dev/)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          case "$APP_URL" in https://*) ;; *) echo "الرابط يجب أن يبدأ بـ https://"; exit 1;; esac
          gradle assembleDebug --no-daemon -PAPP_URL="$APP_URL"
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk vkte-tv.apk && ls -la vkte-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vkte-tv-apk
          path: vkte-tv.apk
